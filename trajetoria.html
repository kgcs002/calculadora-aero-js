<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈️ Simulador de Voo</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url('https://images.unsplash.com/photo-1556388158-158ea5ccacbd');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #333;
      background-blur: 10px; 
    }

    header {
      background-color: rgba(0, 119, 182, 0.85);
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    main {
      max-width: 700px;
      margin: 2rem auto;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      padding: 2rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.2rem;
      background-color: #00b4d8;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0096c7;
    }

    #output {
      margin-top: 2rem;
      padding: 1rem;
      background-color: #e0f7fa;
      border-left: 4px solid #00b4d8;
      border-radius: 6px;
      font-size: 1.1rem;
    }

    #grafico {
      margin-top: 2rem;
    }

    footer {
      text-align: center;
      margin: 3rem 0 1rem;
      color: #f0f0f0;
      font-size: 0.9rem;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      border-top: 2px solid #0077b6;
    }
  </style>
</head>
<body>
  <header>
    <h1>✈️ Simulador de Trajetória de Voo 📈</h1>
  </header>

  <main>
    <label for="velocidade">🚀 Velocidade inicial (m/s):</label>
    <input type="number" id="velocidade" placeholder="Ex: 50" />

    <label for="angulo">📐 Ângulo de subida (graus):</label>
    <input type="number" id="angulo" placeholder="Ex: 45" />

    <label for="tempo">⏱️ Tempo de voo (s):</label>
    <input type="number" id="tempo" placeholder="Ex: 10" />

    <button onclick="simularVoo()">🎯 Simular</button>

    <div id="output"></div>
    <div id="grafico"></div>
  </main>

  <footer>
    &copy; 2025 Simulador de Voo | Desenvolvido por Kauan Sasaqui ✈️🔥
  </footer>

  <script>
    function simularVoo() {
      const v = parseFloat(document.getElementById("velocidade").value);
      const ang = parseFloat(document.getElementById("angulo").value);
      const tempo = parseInt(document.getElementById("tempo").value);

      const g = 9.81;
      const angRad = ang * (Math.PI / 180);
      const vVert = v * Math.sin(angRad);

      let t = [];
      let h = [];
      let hMax = 0;

      for (let i = 0; i <= tempo; i++) {
        let altura = vVert * i - 0.5 * g * i * i;
        altura = Math.max(0, altura);
        t.push(i);
        h.push(altura);
        if (altura > hMax) hMax = altura;
      }

      document.getElementById("output").innerHTML = `📊 Altura máxima alcançada: <strong>${hMax.toFixed(2)} metros</strong>`;

      Plotly.newPlot('grafico', [{
        x: t,
        y: h,
        mode: 'lines+markers',
        name: 'Trajetória',
        line: { color: '#0077b6', width: 3 }
      }], {
        title: '📈 Trajetória de Voo',
        xaxis: { title: 'Tempo (s)' },
        yaxis: { title: 'Altura (m)' }
      });
    }
  </script>
</body>
</html>
